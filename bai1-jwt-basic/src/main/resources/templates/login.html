<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng nhập</title></head>
<body>
<main>
  <h1>Đăng nhập</h1>
  <form id="loginForm">
    <label>Email <input id="email" type="email" autocomplete="username" required></label>
    <label>Mật khẩu <input id="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Đăng nhập</button>
  </form>
  <p id="message" role="status"></p>
</main>
<script src="/js/mainjs.js" defer></script>
</body></html>
