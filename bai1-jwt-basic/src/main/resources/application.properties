spring.application.name=bai1-jwt-basic
server.port=8090

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jwt_springboot3?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Replace this development key with a private Base64 key of at least 32 bytes in production.
jwt.secret-key=${JWT_SECRET_KEY:VGhpc0lzQVNlY3JldEtleUZvckpXVFNwcmluZ0Jvb3QzQXBw}
jwt.expiration=3600000
